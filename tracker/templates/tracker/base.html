{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="dark"> <!-- Dark mode enabled by default via DaisyUI -->
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block head_title %}
            Personal Finance Tracker
        {% endblock %}
    </title>

    <!-- Tailwind + DaisyUI -->
    <script src="https://cdn.tailwindcss.com?plugins=typography,forms,aspect-ratio"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>

    <!-- HTMX -->
    <script src="{% static 'js/htmx.min.js' %}"></script>

    <!-- Custom Styles -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Optional glassmorphism utility */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
        }
    </style>

    {% block extra_head %}
    {% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-gradient-to-br from-gray-900 to-gray-800 text-white min-h-screen">

    {% include 'tracker/partials/navbar.html' %}

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="glass-card p-6 shadow-xl">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
