{% extends 'tracker/base.html' %}

{% block head_title %}
    Transaction Charts
{% endblock %}

{% block content %}
<div class="relative overflow-x-auto bg-gray-800 text-white rounded-lg shadow-lg p-6 mb-12" id="transaction-block">
    <!-- Title Section -->
    <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-center flex items-center justify-center space-x-3 mb-8 transition-transform duration-200 ease-in-out hover:scale-105">
        <!-- Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-indigo-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        <span class="text-white">Transactions Charts</span>
    </h1>

    <!-- Chart Container -->
    <div class="bg-gray-700 p-6 rounded-lg shadow-md transition-all transform hover:scale-105 hover:shadow-lg hover:shadow-indigo-500/50 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-opacity-50">
        {% include 'tracker/partials/charts-container.html' %}
    </div>

</div>

{% endblock %}
